[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "eyetracker"
version = "1.0.0"
description = "Контроль присутствия, распознавание лиц, блокировка экрана и контроль взгляда (Radxa ROCK 5T / Linux)"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["numpy>=1.21", "opencv-python-headless>=4.8"]

[project.optional-dependencies]
gaze = ["mediapipe>=0.10"]
pyside6 = ["PySide6>=6.4"]
test = ["pytest"]

[project.scripts]
eyetracker = "eyetracker.__main__:main"

[tool.setuptools.packages.find]
include = ["eyetracker*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
